<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gradiente do céu/sol -->
    <linearGradient id="sunRays" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <!-- Gradiente azul das células solares -->
    <linearGradient id="solarCell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <!-- Gradiente da bateria verde -->
    <linearGradient id="batteryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
  </defs>

  <!-- Fundo sutil com cantos arredondados -->
  <rect width="64" height="64" rx="14" fill="#0B1528" />

  <!-- Raios de sol no canto superior esquerdo -->
  <!-- Centro do sol ~ (26, 26) -->
  <g stroke="url(#sunRays)" stroke-width="2" stroke-linecap="round">
    <line x1="26" y1="9" x2="26" y2="4" />
    <line x1="20" y1="11" x2="17" y2="7" />
    <line x1="15" y1="15" x2="11" y2="12" />
    <line x1="11" y1="21" x2="7" y2="19" />
    <line x1="10" y1="27" x2="5" y2="27" />
    <line x1="12" y1="33" x2="8" y2="34" />
    <line x1="32" y1="11" x2="35" y2="7" />
  </g>

  <!-- Cabo preto ligando o painel à bateria -->
  <path d="M 37 45 C 44 45, 48 40, 52 32" stroke="#000000" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 37 45 C 44 45, 48 40, 52 32" stroke="#E2E8F0" stroke-width="1.2" stroke-linecap="round" fill="none" />

  <!-- Suporte e mastro preto do painel solar -->
  <!-- Base -->
  <rect x="29" y="52" width="16" height="3" rx="1.5" fill="#0F172A" stroke="#334155" stroke-width="0.8" />
  <!-- Mastro -->
  <rect x="36" y="42" width="3.5" height="11" rx="0.5" fill="#0F172A" stroke="#334155" stroke-width="0.8" />

  <!-- Painel Solar Fotovoltaico em perspectiva -->
  <!-- Trapézio: topo esquerdo (27, 18), topo direito (43, 18), base direita (39, 44), base esquerda (21, 44) -->
  <!-- Borda preta e moldura -->
  <polygon points="27,17 44,17 40,45 20,45" fill="#0F172A" stroke="#0F172A" stroke-width="2" stroke-linejoin="round" />
  <polygon points="27.5,18 43.5,18 39.5,44 20.8,44" fill="url(#solarCell)" stroke="#0284C7" stroke-width="0.8" />

  <!-- Linha divisória central horizontal do painel (duas seções) -->
  <polygon points="24,31 41.5,31 41.5,32.2 24,32.2" fill="#0F172A" />

  <!-- Células solares (Grade branca/azul clara) -->
  <!-- Fila superior de células -->
  <g fill="#1E40AF" stroke="#60A5FA" stroke-width="0.6">
    <polygon points="28,19 32,19 31,30 25.5,30" />
    <polygon points="33,19 37.5,19 36.5,30 32,30" />
    <polygon points="38.5,19 43,19 41,30 37.5,30" />
  </g>
  <!-- Fila inferior de células -->
  <g fill="#1D4ED8" stroke="#93C5FA" stroke-width="0.6">
    <polygon points="25,33 30.5,33 29.5,43 22,43" />
    <polygon points="31.5,33 36,33 35,43 30.5,43" />
    <polygon points="37,33 40.5,33 38.8,43 36,43" />
  </g>

  <!-- Bateria Verde -->
  <g transform="translate(48, 16)">
    <!-- Terminal superior da bateria -->
    <rect x="4.5" y="0" width="5" height="2.5" rx="1" fill="#15803D" />
    <!-- Corpo da bateria -->
    <rect x="1" y="2" width="12" height="18" rx="2.5" fill="url(#batteryGrad)" stroke="#166534" stroke-width="0.8" />
    <!-- Raio branco de energia no centro da bateria -->
    <path d="M 7.5 4 L 4.5 11 L 7 11 L 6.2 18 L 10 10 L 7.5 10 Z" fill="#FFFFFF" />
  </g>
</svg>
